; SmartFarm ESP32 Firmware
; PlatformIO Project Configuration

[env:esp32dev]
platform   = espressif32
board      = esp32dev
framework  = arduino

monitor_speed  = 115200
upload_speed   = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=3

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.3
  paulstoffregen/OneWire@^2.3
  milesburton/DallasTemperature@^3.11
  4-20ma/ModbusMaster@^2.0
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit GFX Library@^1.11
  tzapu/WiFiManager@^2.0
